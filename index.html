<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b1a"><link rel="manifest" href="manifest.json"><title>Event Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#101b1a;color:#f5f1e7;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px 18px 90px}h1{font-size:42px;letter-spacing:-2px;margin:5px 0}small,.muted{color:#aabbb3}button,input,select{font:inherit;color:inherit;background:#20312e;border:1px solid #40554d;border-radius:10px;padding:10px}button{cursor:pointer}button.active{background:#d8ee87;color:#15201b}nav,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.hero{background:#263c32;border-radius:20px;padding:24px;margin:20px 0}h2{margin:0 0 12px}article{border-bottom:1px solid #40554d;padding:18px 0;display:flex;gap:15px;align-items:start}article div{flex:1}article p{margin:7px 0}a{color:#d8ee87} .date{max-width:65px;color:#d8ee87;font-weight:bold}footer{position:fixed;bottom:0;background:#101b1a;border-top:1px solid #40554d;width:100%;padding:12px;text-align:center}textarea{width:100%}label{display:block;margin:8px 0}</style><main><small>RENO / TAHOE • LOCAL DISCOVERY</small><h1>Event Radar ◎</h1><div class="muted">Find something worth leaving the house for.</div><nav id="nav"></nav><div id="body"></div></main><footer><small><span id="feedstatus">Sample data · not live verified</span></small></footer><script>
const seed=[['2026-11-27','20:00','Bargain Bin Improv','Reno Improv','Reno','Comedy',2,true,'One-dollar comedy','https://renoimprov.org/'],['2026-11-28','18:00','Great Goat Grab','The Weigh Station','Reno','Art',3,true,'Interactive dinner and staged art heist','https://www.upside-down-universe.com/events'],['2026-11-28','19:30','Sorry! Wrong Chimney!','Reno Little Theater','Reno','Theater',3,false,'Holiday farce','https://www.renolittletheater.org/'],['2026-11-28','20:00','Boot Juice','Crystal Bay Casino','Tahoe','Music',2,false,'Live music','https://www.crystalbaycasino.com/entertainment/events/'],['2026-11-29','10:00','Risograph Printing','Laika Press','Reno','Workshop',3,true,'Make printed artwork','https://reno.wtf/this-weekend/'],['2026-12-03','19:30',"Kala’e + Kalena",'UNR','Reno','Music',3,false,'Hawaiian music','https://events.unr.edu/'],['2026-12-04','19:30','Büttcracker: Journey to Uranus','Brüka Theatre','Reno','Theater',3,true,'Space-themed parody','https://www.bruka.org/'],['2026-12-04','19:00','First Fridays on 4th','Brewery District','Reno','Music',3,false,'Neighborhood music crawl','https://renobrewerydistrict.com/'],['2026-12-04','19:00','A Christmas Carol','Brewery Arts Center','Carson City','Theater',3,true,'Speakeasy-inspired Dickens','https://breweryarts.org/']].map((a,i)=>Object.fromEntries(['date','time','name','venue','region','category','rating','side','description','url'].map((k,j)=>[k,a[j]]).concat([['id',String(i)]])));
let coverage=[];let events=JSON.parse(localStorage.getItem('events')||'null')||seed,saved=new Set(JSON.parse(localStorage.getItem('saved')||'[]')),tab='Discover',cat='All',region='All',day='',rank='All';const tabs=['Discover','Side Quests','My Radar','Build My Night','Venues','Stay or GTFO','Import'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toggle(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('saved',JSON.stringify([...saved]));render()}function select(k,v){if(k==='cat')cat=v;if(k==='region')region=v;if(k==='rank')rank=v;if(k==='day')day=v;render()}function opts(k,values,current){return `<select aria-label="${k}" onchange="select('${k}',this.value)">${values.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}</select>`}function cards(list){return list.map(e=>`<article><div class="date">${esc(e.date.slice(5))}<br><small>${esc(e.time)}</small></div><div><strong>${['','🤷','👍','🔥'][e.rating]} ${e.side?'🧙 ':''}${esc(e.name)}</strong><p class="muted">${esc(e.venue)} · ${esc(e.region)} · ${esc(e.category)}</p><p>${esc(e.description)}</p><small>${esc(e.verification||'Imported; not verified')}</small><br>${/^https?:\/\//.test(e.url)?`<a href="${esc(e.url)}" target="_blank" rel="noopener">Event source ↗</a>`:''}</div><button data-id="${esc(e.id)}" onclick="toggle(this.dataset.id)" aria-label="Save event">${saved.has(e.id)?'★':'☆'}</button></article>`).join('')||'<p>No matching events.</p>'}function render(){nav.innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab=this.textContent;render()">${t}</button>`).join('');let today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let limit=new Date(today+'T12:00:00Z');limit.setUTCDate(limit.getUTCDate()+9);let cutoff=limit.toISOString().slice(0,10);let list=events.filter(e=>(tab==='My Radar'||(e.date>=today&&e.date<=cutoff))&&(cat==='All'||e.category===cat)&&(region==='All'||e.region===region)&&(rank==='All'||e.rating===3)&&(!day||e.date===day)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let filters=`<div class="filters">${opts('cat',['All',...new Set(events.map(e=>e.category))],cat)}${opts('region',['All',...new Set(events.map(e=>e.region))],region)}${opts('rank',['All','Must Go'],rank)}<input aria-label="Event date" type="date" value="${day}" onchange="select('day',this.value)"><button onclick="cat=region=rank='All';day='';render()">Reset</button></div>`;if(tab==='Discover'||tab==='Side Quests'||tab==='My Radar'){body.innerHTML=(tab==='Discover'?'<div class="hero"><small>THE LOCAL EDIT</small><h2>Make the ordinary weekend extraordinary.</h2>Small venues. Big stories. Unexpected experiences.</div>':'')+filters+cards(list.filter(e=>tab==='Side Quests'?e.side:tab==='My Radar'?saved.has(e.id):true))}else if(tab==='Build My Night'){body.innerHTML='<h2>Build My Night</h2><p>Choose a date and region. Save your favorites. Start times only; check durations and travel before booking.</p>'+filters+cards(list)}else if(tab==='Venues'){body.innerHTML='<h2>Venue coverage</h2>'+coverage.map(c=>`<article><div>${esc(c.venue)}<p>${esc(c.state)} · ${esc(c.count??'—')} events</p><small>${esc(c.checked_at||'')}</small></div></article>`).join('')+[...new Set([...events.map(e=>e.venue),'Black Rabbit Mead','Lead Dog','The Alpine','Dead Ringer','Good Luck Macbeth','Pioneer Center','PK Social Club','Truckee theater companies'])].map(v=>`<article><div>${esc(v)}<p class="muted">${events.filter(e=>e.venue===v).length} imported listings · live check pending</p></div></article>`).join('')}else if(tab==='Stay or GTFO'){let weekends=events.filter(e=>[0,5,6].includes(new Date(e.date+'T12:00:00').getDay())),score=Math.min(10,weekends.reduce((s,e)=>s+(e.rating===3?1.5:.5),0));body.innerHTML=`<div class="hero"><small>HEURISTIC · ALL IMPORTED WEEKEND EVENTS</small><h1>${score}/10</h1><h2>${score>=7?'Stay in town':'Consider an escape'}</h2><p>${weekends.length} listings. Score rewards must-go events; not a live assessment.</p></div>`+cards(weekends)}else{body.innerHTML='<h2>Import event feed</h2><p>Load a JSON array with id, date (YYYY-MM-DD), time (HH:MM), name, venue, region, category, rating (1–3), side (boolean), description and url. Replaces the current feed.</p><input type="file" accept=".json,application/json" onchange="load(this.files[0])"><p id="status"></p><button onclick="events=seed;localStorage.removeItem(\'events\');render()">Restore sample data</button>'}}async function load(f){try{let a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(e=>['id','date','time','name','venue','region','category','description','url'].every(k=>typeof e[k]==='string')&&[1,2,3].includes(e.rating)&&typeof e.side==='boolean'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)))throw Error('Invalid event format');events=a;localStorage.setItem('events',JSON.stringify(a));tab='Discover';cat=region=rank='All';day='';render()}catch(e){document.getElementById('status').textContent=e.message}}render();fetch('./feed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Feed unavailable');return r.json()}).then(f=>{if(!f.generated_at)return;events=f.events;coverage=f.coverage;localStorage.setItem('events',JSON.stringify(events));document.getElementById('feedstatus').textContent='Last scan: '+new Date(f.generated_at).toLocaleString()+' · check source before booking';render()}).catch(()=>{document.getElementById('feedstatus').textContent='Offline or feed unavailable · cached/imported data'});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
